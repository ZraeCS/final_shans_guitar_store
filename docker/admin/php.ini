; Shan's Guitar admin - PHP settings inside Docker
date.timezone = Asia/Manila
memory_limit = 512M
upload_max_filesize = 8M
post_max_size = 10M
expose_php = Off

; Faster pages; files are still re-checked on every request,
; so code you edit in VS Code shows up immediately.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
