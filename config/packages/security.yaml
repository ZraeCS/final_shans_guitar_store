security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    # 'auto' reads the bcrypt hashes the store made with password_hash(),
    # so every existing password keeps working.
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # An admin can do everything a staff member can (plus admin-only pages)
    role_hierarchy:
        ROLE_ADMIN: [ROLE_STAFF]

    # Load users from the `users` table, logging in with their email
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\LoginAuthenticator
            # Only active staff and admin accounts may log in here (customers use the store)
            user_checker: App\Security\StaffUserChecker
            # Logged in but not allowed (e.g. staff opening an admin page):
            # show "Access denied" and send them to their own home page
            access_denied_handler: App\Security\AccessDeniedHandler
            logout:
                path: app_logout
                # where to go after logging out
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 1 week
                path: /

    # Note: Only the *first* matching rule is applied, so the admin-only rules come first
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        # Admin only: the admin dashboard, user management and sales reports
        - { path: ^/dashboard$, roles: ROLE_ADMIN }
        - { path: ^/dashboard/(users|reports), roles: ROLE_ADMIN }
        # Everything else in the panel: staff (and admins, through role_hierarchy)
        - { path: ^/dashboard, roles: ROLE_STAFF }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
