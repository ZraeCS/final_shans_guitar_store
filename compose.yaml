
services:
  shansguitar_mysql:
    image: mysql:latest
    container_name: shansguitar_mysql
    restart: unless-stopped
    command: --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shansguitar
      TZ: Asia/Manila
    ports:
      - "3313:3306"
    volumes:
      - shansguitar_db_data:/var/lib/mysql
    networks:
      - shansguitar_network

  shansguitar_phpmyadmin:
    image: phpmyadmin
    container_name: shansguitar_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: shansguitar_mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - shansguitar_mysql
    networks:
      - shansguitar_network

volumes:
  shansguitar_db_data:
    name: shansguitar_db_data

networks:
  shansguitar_network:
    name: shansguitar_network